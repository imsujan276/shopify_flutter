name: shopify_flutter
description: A Flutter package to seamlessly connect your Shopify store with your app.
version: 4.2.0
repository: https://github.com/imsujan276/shopify_flutter
issue_tracker: https://github.com/imsujan276/shopify_flutter/issues

tags:
  - shopify
  - shopify_flutter

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  graphql_flutter: ^5.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  intl: ">=0.20.2 <0.21.2"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # dart run build_runner watch --delete-conflicting-outputs
  build_runner: ^2.15.1
  # Codegen only — must stay a dev dependency so consumers don't pull the
  # build toolchain (and its analyzer pin) into their runtime graph.
  json_serializable: ^6.14.0
  freezed: ^3.2.5

screenshots:
  - description: "Search Example of the shopify storefront"
    path: example/screenshot/search.png
